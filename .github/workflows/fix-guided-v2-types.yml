name: Apply guided V2 TypeScript fixes

on:
  push:
    branches: [guided-journeys-responsive]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-guided-v2-types.mjs
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Fix responsive guided V2 TypeScript types"
          git push origin HEAD:guided-journeys-responsive
