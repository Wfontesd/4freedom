name: Materialize guided V2 source

on:
  push:
    branches: [guided-journeys-responsive]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/materialize-guided-v2.mjs
      - name: Commit generated source
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app app.json package.json README.md IMPLEMENTATION_PLAN.md ARCHITECTURE.md src
          git commit -m "Materialize guided mobile and desktop V2"
          git push origin HEAD:guided-journeys-responsive
